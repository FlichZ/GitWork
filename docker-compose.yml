version: '3.8'

services:
  web:
    build: .
    restart: always
    depends_on:
      - db
      - redis
    environment:
      - DB_NAME=docflow_guardian
      - DB_USER=postgres
      - DB_PASSWORD=postgres_secure_password
      - DB_HOST=db
      - DB_PORT=5432
      - SECRET_KEY=ajk28d9al3mkd92h3d9j29dh39dj329hdm38ah4d
      - DEBUG=0
      - ALLOWED_HOSTS=localhost,127.0.0.1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    ports:
      - "8000:8000"
      - "8001:8001"  # Порт для WebSockets через Daphne

  db:
    image: postgres:15
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_PASSWORD=postgres_secure_password
      - POSTGRES_USER=postgres
      - POSTGRES_DB=docflow_guardian
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  nginx:
    image: nginx:1.21
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/static
      - media_volume:/app/media
    ports:
      - "80:80"
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
  media_volume:
  redis_data: 
 